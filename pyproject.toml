[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-llm-infra"
version = "0.2.0"
description = "Vendor-neutral RAG + LLM serving infrastructure: swappable LLM protocol and vector store (FAISS/NumPy/Qdrant), cached embedding index, and observability."
readme = "README.md"
# Bounded at both ends: `>=3.12` alone also claims every future release. Raise
# the ceiling in the commit that adds the CI matrix leg, never before.
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Marwa Ben Salem" }]
keywords = ["rag", "llm", "vector-store", "faiss", "qdrant", "openai", "embeddings", "retrieval"]
classifiers = [
  # 4 - Beta: published, versioned and gated, but the public surface is still
  # moving (0.2.0 removed a constructor default).
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
faiss = ["faiss-cpu>=1.9"]
# h2 floor: qdrant-client pulls httpx[http2], and h2 < 4.4.1 carries
# CVE-2026-71554.
qdrant = ["qdrant-client>=1.12", "h2>=4.4.1"]
embeddings = ["sentence-transformers>=3.0"]
otel = ["opentelemetry-api>=1.29", "opentelemetry-sdk>=1.29", "opentelemetry-exporter-otlp-proto-grpc>=1.29"]
# starlette floor: fastapi requires starlette>=0.46, and 1.2.1 carries
# PYSEC-2026-248 and -249. Named directly so the floor cannot be lost to a
# fastapi range change.
serve = ["fastapi>=0.115", "uvicorn>=0.30", "starlette>=1.3.1"]
# Enables EmbeddingEngine's memory-pressure cache trimming (a no-op without it).
psutil = ["psutil>=5.9"]
dev = [
  "pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "pytest-timeout>=2.3",
  "httpx>=0.27",
  "codespell>=2.3", "pip-audit>=2.7",
  "pyyaml>=6.0", "types-PyYAML>=6.0",  # tests read the workflow files
  "packaging>=23.0",   # tests/test_declared_bounds.py parses the specifiers
  "ruff>=0.6", "mypy>=1.11", "build>=1.0",
  "faiss-cpu>=1.9", "qdrant-client>=1.12", "fastapi>=0.115", "uvicorn>=0.30",
  "starlette>=1.3.1", "h2>=4.4.1",
  # The real SDK, so the client-lifecycle tests run against its actual
  # signatures rather than a mock that answers to anything.
  "openai>=1.0",
  # psutil + the OTel SDK so CI exercises the real memory-pressure-trim and
  # tracing-configuration branches instead of their import-guarded fallbacks.
  "psutil>=5.9", "opentelemetry-api>=1.29", "opentelemetry-sdk>=1.29",
]

[project.urls]
Homepage = "https://github.com/MarwaBS/rag-llm-infra"
Repository = "https://github.com/MarwaBS/rag-llm-infra"
Changelog = "https://github.com/MarwaBS/rag-llm-infra/blob/main/CHANGELOG.md"
Issues = "https://github.com/MarwaBS/rag-llm-infra/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_llm_infra"]

[tool.ruff]
target-version = "py312"
src = ["src"]
exclude = [".git", ".venv", "__pycache__"]

[tool.ruff.lint]
# F/E (pyflakes/pycodestyle) + I (import sort), B (bugbear: real-bug lints),
# UP (pyupgrade: keep syntax current to the py312 floor).
select = ["F", "E", "I", "B", "UP"]
# E501 only: `ruff format` owns line length and leaves some lines long, mostly
# prose in docstrings it will not reflow. Enabling both would contradict.
# E402, E701 and E741 were removed after measuring that nothing needs them.
ignore = ["E501"]

[tool.pytest.ini_options]
# A test that blocks gets a verdict instead of stalling the job. It does not
# cover a hang AFTER the last test: the timer is armed per test, so a leaked
# non-daemon thread still blocks interpreter shutdown, which is why the
# starvation test runs its threads as daemons and joins them with a timeout.
addopts = "-ra --import-mode=importlib --timeout=60"
asyncio_mode = "auto"
pythonpath = ["src", "."]
markers = ["slow: marks tests as slow (deselect with '-m not slow')"]
# faiss-cpu's SWIG bindings emit these three on import. They come from a
# dependency's generated code and no change here can silence them at source.
filterwarnings = [
  "ignore:.*SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:.*SwigPyObject has no __module__ attribute:DeprecationWarning",
  "ignore:.*swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.mypy]
# No python_version pin: each CI leg type-checks under its own interpreter, so
# the 3.13 leg is not a second copy of the 3.12 one.

# Scoped, not global: these are the optional dependencies that ship no type
# information. A blanket setting also swallows a typo in a first-party import.
[[tool.mypy.overrides]]
module = ["faiss.*", "sentence_transformers.*", "psutil.*", "qdrant_client.*", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rag_llm_infra.*"]
disallow_untyped_defs = true

[tool.codespell]
skip = "./.git,./.venv,./dist,./build,./htmlcov,./.mypy_cache,./.pytest_cache"
ignore-words-list = "arange"  # numpy's np.arange

[tool.coverage.run]
source = ["src/rag_llm_infra", "scripts"]
omit = ["tests/*", "*/__init__.py"]
